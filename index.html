<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>De Vera Family Artist Portfolio System</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600&display=swap">
<style>
:root{--bg:#f3f2ee;--panel:#fffefb;--ink:#1f1f1c;--mute:#66655d;--line:#dcdad2;--forest:#455a4b;--btnink:#fff;--coral:#c4512c;--ok:#2f6b45;
--serif:'Source Serif 4',Georgia,'Times New Roman',serif;--sans:system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161815;--panel:#20231f;--ink:#eceae2;--mute:#a7a69b;--line:#383b33;--forest:#7ba488;--btnink:#10140f;--coral:#f08a66;--ok:#7cc795;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161815;--panel:#20231f;--ink:#eceae2;--mute:#a7a69b;--line:#383b33;--forest:#7ba488;--btnink:#10140f;--coral:#f08a66;--ok:#7cc795;color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--serif)}
h1,h2,h3{font-weight:600;line-height:1.15;margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
header{border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header .wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding-top:12px;padding-bottom:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font:700 15px var(--sans);letter-spacing:.02em}
.brand i{width:34px;height:34px;border-radius:50%;background:var(--forest);color:var(--btnink);display:grid;place-items:center;font-style:normal;font-size:18px}
.brand span{font:400 14px var(--serif);color:var(--mute)}
nav{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
nav a,nav button{font:400 15px var(--serif);padding:8px 12px;border-radius:999px;border:1px solid transparent;background:none;color:inherit;text-decoration:none;cursor:pointer}
nav a:hover,nav button:hover{border-color:var(--line)}
nav .pill{border-color:var(--mute)}
.btn{display:inline-block;font:600 15px var(--sans);background:var(--forest);color:var(--btnink);border:0;border-radius:6px;padding:11px 18px;cursor:pointer;text-decoration:none}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:7px 12px;font-size:13px}
.lnk{background:none;border:0;color:var(--coral);font:400 14px var(--serif);cursor:pointer;padding:4px}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:center;padding:56px 0 40px}
.hero h1{font-size:clamp(2.4rem,6vw,4.2rem);letter-spacing:-.02em}
.hero p{max-width:46ch;color:var(--mute);font-size:1.1rem;margin:16px 0 24px}
figure{margin:0}
figure img,.thumb{display:block;width:100%;border-radius:4px;background:var(--line)}
figcaption{font-size:14px;color:var(--mute);margin-top:8px}
.bar{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0 24px}
.bar input,.bar select,input,select,textarea{font:400 16px var(--serif);padding:11px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);width:100%}
.bar input{flex:1 1 280px;width:auto}.bar select{flex:0 0 220px;width:auto}
label{display:block;font:600 13px var(--sans);margin:14px 0 6px;color:var(--mute)}
textarea{min-height:96px;resize:vertical}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:22px}
.card{text-decoration:none;background:var(--panel);border:1px solid var(--line);display:block;border-radius:4px;overflow:hidden}
.card:hover{border-color:var(--forest)}
.card img{aspect-ratio:4/3;object-fit:cover;width:100%;display:block}
.card div{padding:14px 16px 16px}
.card h3{font-size:1.25rem}
.meta{color:var(--mute);font-size:14px;margin-top:4px}
section{padding:28px 0}
.empty{padding:40px;text-align:center;color:var(--mute);border:1px dashed var(--line)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);padding:24px;border-radius:4px}
.panel h2{font-size:1.5rem;margin-bottom:6px}
.row{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.row .thumb{width:64px;height:64px;object-fit:cover;flex:none}
.row b{font:600 15px var(--sans)}
.row .grow{flex:1;min-width:0}
.tag{display:inline-block;font:600 12px var(--sans);padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--mute)}
.tag.ok{color:var(--ok);border-color:var(--ok)}.tag.warn{color:var(--coral);border-color:var(--coral)}
.prof{display:grid;grid-template-columns:280px 1fr;gap:32px;padding:36px 0 12px;align-items:start}
.prof h1{font-size:clamp(2rem,5vw,3rem)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:24px}
.gal article img{aspect-ratio:4/3;object-fit:cover;width:100%;border-radius:4px;display:block}
.gal h3{font-size:1.15rem;margin-top:10px}
.gal p{margin:4px 0 10px;color:var(--mute);font-size:15px}
.narrow{max-width:440px;margin:48px auto}
.hint{font-size:14px;color:var(--mute);margin-top:14px}
.err{color:var(--coral);font:600 14px var(--sans);margin-top:10px}
.sr{position:absolute;left:-9999px}
dialog{border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);width:min(520px,92vw);padding:24px}
dialog::backdrop{background:rgba(0,0,0,.5)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--forest);color:var(--btnink);font:600 14px var(--sans);padding:12px 18px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:92vw}
#toast.on{opacity:1}
footer{border-top:1px solid var(--line);margin-top:30px;padding:24px 0;color:var(--mute);font-size:14px}
.collage{display:grid;grid-template-columns:1fr 1fr;gap:14px}.collage figure:nth-child(even){margin-top:30px}.collage img{aspect-ratio:4/3;object-fit:cover;box-shadow:0 6px 18px rgba(0,0,0,.12)}
.card{transition:transform .2s,border-color .2s,box-shadow .2s}.card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,0,0,.12)}
.card h3{font-size:1.3rem}.hero{border-bottom:1px solid var(--line);margin-bottom:8px}#directory h2,#about h2{font-size:2rem}
@media (max-width:760px){.hero,.two,.prof{grid-template-columns:1fr}.hero{padding-top:32px}nav{margin-left:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* Refined visual layer */
:root{
  --bg:#f6f4ef;--panel:#fffdf9;--ink:#20251f;--mute:#6c7168;--line:#deded5;
  --forest:#314f42;--forest-2:#426957;--coral:#c96846;--ok:#397553;
  --shadow:0 18px 50px rgba(38,51,42,.08);--soft-shadow:0 8px 24px rgba(38,51,42,.08)
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141915;--panel:#1e261f;--ink:#eff0e9;--mute:#a5ada2;--line:#364139;--forest:#8cc0a1;--forest-2:#a0d4b1;--coral:#f29a75;--shadow:0 18px 50px rgba(0,0,0,.22);--soft-shadow:0 8px 24px rgba(0,0,0,.18)}}
:root[data-theme="dark"]{--bg:#141915;--panel:#1e261f;--ink:#eff0e9;--mute:#a5ada2;--line:#364139;--forest:#8cc0a1;--forest-2:#a0d4b1;--coral:#f29a75;--shadow:0 18px 50px rgba(0,0,0,.22);--soft-shadow:0 8px 24px rgba(0,0,0,.18)}
body{background:radial-gradient(circle at 12% 0%,rgba(209,225,211,.34),transparent 28rem),var(--bg);letter-spacing:.005em}
header{background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);border-bottom-color:color-mix(in srgb,var(--line) 78%,transparent)}
header .wrap{min-height:68px;padding-top:10px;padding-bottom:10px}
.brand{font-size:14px;letter-spacing:.08em;text-transform:uppercase;gap:12px}
.brand i{width:38px;height:38px;border-radius:12px;background:linear-gradient(145deg,var(--forest-2),var(--forest));box-shadow:0 6px 16px rgba(49,79,66,.2);font-size:19px}
.brand span{font-size:13px;text-transform:none;letter-spacing:0}
nav{gap:4px}
nav a,nav button{font-size:14px;border-radius:10px;padding:8px 11px;transition:background .2s,border-color .2s,color .2s}
nav a:hover,nav button:hover{background:var(--panel);border-color:var(--line)}
nav .pill{background:var(--forest);color:var(--btnink);border-color:var(--forest);box-shadow:0 5px 14px rgba(49,79,66,.16)}
nav .pill:hover{background:var(--forest-2);border-color:var(--forest-2);color:var(--btnink)}
.theme-toggle{font:600 12px var(--sans);display:inline-flex;align-items:center;gap:6px;padding:8px 11px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);cursor:pointer;white-space:nowrap;transition:background .2s,border-color .2s,transform .2s}.theme-toggle:hover{border-color:var(--forest-2);transform:translateY(-1px)}

.btn{border-radius:10px;background:linear-gradient(135deg,var(--forest-2),var(--forest));box-shadow:0 7px 16px rgba(49,79,66,.16);transition:transform .2s,box-shadow .2s,background .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 11px 22px rgba(49,79,66,.22);background:linear-gradient(135deg,var(--forest),var(--forest-2))}
.btn.ghost{box-shadow:none;background:transparent}
.btn.ghost:hover{color:var(--forest);border-color:var(--forest);background:color-mix(in srgb,var(--forest) 7%,transparent)}
.hero{position:relative;min-height:480px;gap:64px;padding:76px 0 62px;border-bottom:0;margin-bottom:20px}
.hero:before{content:'DE VERA FAMILY ARTISTS';display:block;position:absolute;top:25px;left:0;font:700 11px var(--sans);letter-spacing:.18em;color:var(--coral)}
.hero h1{max-width:8ch;font-size:clamp(3.4rem,7vw,6.2rem);letter-spacing:-.055em;line-height:.96}
.hero p{max-width:42ch;color:var(--mute);font-size:1.16rem;line-height:1.7;margin:22px 0 30px}
.hero .btn{padding:13px 20px}
.collage{gap:18px;transform:rotate(1deg)}
.collage figure:nth-child(even){margin-top:42px}
.collage figure{transition:transform .25s}
.collage figure:hover{transform:translateY(-5px) rotate(-1deg)}
figure img,.thumb{border-radius:12px}
.collage img{box-shadow:0 16px 30px rgba(38,51,42,.14);border:5px solid var(--panel)}
figcaption{font:13px var(--sans);letter-spacing:.01em;margin:10px 4px 0}
section{padding:38px 0}
section h2{font-size:clamp(1.8rem,3vw,2.45rem);letter-spacing:-.03em}
#directory h2,#about h2{font-size:clamp(1.8rem,3vw,2.45rem)}
.bar{align-items:center;margin:22px 0 28px;padding:10px;background:color-mix(in srgb,var(--panel) 72%,transparent);border:1px solid var(--line);border-radius:14px}
.bar input,.bar select,input,select,textarea{border-radius:10px;background:var(--panel);transition:border-color .2s,box-shadow .2s}
.bar input:focus,.bar select:focus,input:focus,select:focus,textarea:focus{border-color:var(--forest-2);box-shadow:0 0 0 4px color-mix(in srgb,var(--forest-2) 15%,transparent);outline:0}
.bar select{flex-basis:210px}
.grid{gap:26px}
.card{border-radius:14px;border-color:color-mix(in srgb,var(--line) 82%,transparent);box-shadow:0 3px 0 rgba(49,79,66,.02);transition:transform .25s,border-color .25s,box-shadow .25s}
.card:hover{border-color:var(--forest-2);box-shadow:var(--soft-shadow);transform:translateY(-6px)}
.card img{aspect-ratio:5/4;filter:saturate(.92);transition:transform .35s,filter .35s}
.card:hover img{transform:scale(1.035);filter:saturate(1.04)}
.card div{padding:17px 18px 19px}
.card h3{font-size:1.22rem;letter-spacing:-.015em}
.meta{font-family:var(--sans);font-size:12px;letter-spacing:.015em}
.two{gap:26px}
.panel{border-radius:16px;padding:28px;box-shadow:var(--soft-shadow);border-color:color-mix(in srgb,var(--line) 82%,transparent)}
.panel h2{font-size:1.45rem;letter-spacing:-.025em}
.row{padding:16px 0}
.row .thumb{border-radius:10px}
.tag{font-size:11px;letter-spacing:.03em;text-transform:uppercase;padding:4px 9px}
.prof{grid-template-columns:minmax(240px,340px) 1fr;gap:46px;padding:44px 0 24px}
.prof figure img{box-shadow:var(--shadow);border:7px solid var(--panel)}
.prof h1{font-size:clamp(2.5rem,5vw,4.2rem);letter-spacing:-.05em}
.prof .btn{margin-top:4px}
.gal{gap:32px 26px}
.gal article img{border-radius:12px;box-shadow:var(--soft-shadow)}
.gal h3{font-size:1.2rem;letter-spacing:-.015em}
.narrow{margin:72px auto}
.empty{border-radius:14px;background:color-mix(in srgb,var(--panel) 62%,transparent);padding:48px 30px}
dialog{border-radius:16px;padding:30px;box-shadow:0 24px 80px rgba(0,0,0,.2)}
dialog h2{font-size:1.8rem;letter-spacing:-.03em}
#toast{border-radius:10px;box-shadow:var(--soft-shadow)}
footer{margin-top:48px;padding:30px 0;font-family:var(--sans);font-size:12px;letter-spacing:.02em}
@media (max-width:760px){
  header .wrap{gap:10px}.brand{width:100%}.brand span{margin-left:auto}
  nav{width:100%;overflow:auto;flex-wrap:nowrap;padding-bottom:2px;margin-left:0}
  nav a,nav button{white-space:nowrap}
  .hero{min-height:0;gap:34px;padding:66px 0 40px}.hero h1{max-width:10ch}.hero p{font-size:1.05rem}
  .collage{gap:10px}.collage figure:nth-child(even){margin-top:24px}.collage img{border-width:3px}
  .bar{padding:8px;gap:8px}.bar input,.bar select{flex-basis:100%;width:100%}
  .panel{padding:21px}.prof{gap:28px;padding-top:30px}.prof figure{max-width:360px}
}
</style>
</head>
<body>
<header><div class="wrap">
<a class="brand" href="#home"><i>D</i>DE VERA FAMILY ARTIST <span>Portfolio System</span></a>
<nav id="nav" aria-label="Main"></nav><button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to dark mode" title="Switch theme">◐ <span>Dark mode</span></button></div></header>
<main class="wrap" id="app"></main>
<footer><div class="wrap">De Vera’s Portfolio System · Nueva Vizcaya State University, College of Information Technology · Prototype with sample data and sample artwork.</div></footer>
<dialog id="dlg" aria-labelledby="dt"><form id="inqf" autocomplete="off">
<h2 id="dt">Send an inquiry</h2><p class="meta" id="dsub"></p>
<label for="itype">What do you need?</label>
<select id="itype"><option>Purchase interest</option><option>Commission request</option><option>General question</option></select>
<label for="iname">Your name</label><input id="iname" required>
<label for="imail">Your email</label><input id="imail" type="email" required>
<label for="imsg">Message</label><textarea id="imsg" required></textarea>
<input id="trap" tabindex="-1" aria-hidden="true" style="position:absolute;left:-9999px">
<label style="display:flex;gap:8px;align-items:flex-start;font-weight:400"><input id="icon" type="checkbox" required style="width:auto;margin-top:4px">I agree that my details are shared privately with this artist only to reply to this inquiry.</label>
<p class="hint">No payment is taken here. Any sale or commission is arranged between you and the artist.</p>
<div style="display:flex;gap:10px;margin-top:16px"><button class="btn" type="submit">Send inquiry</button><button class="btn ghost" type="button" id="dx">Cancel</button></div>
</form></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<script>
const SPECS=['Painting','Photography','Illustration','Sculpture','Mixed Media'];
const PH='data:image/svg+xml,'+encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 300'><rect width='400' height='300' fill='#c9c7bd'/><path d='M0 300V200L120 140L210 210L300 130L400 220V300Z' fill='#a9a79b'/></svg>");
const mx=(h,t,w)=>{const n=parseInt(h.slice(1),16);return '#'+[n>>16,n>>8&255,n&255].map(x=>Math.round(x+((w?255:0)-x)*t).toString(16).padStart(2,'0')).join('')};
const SV=s=>'data:image/svg+xml,'+encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 300'>"+s+'</svg>');
const shrink=f=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>{const i=new Image();i.onload=()=>{const s=Math.min(1,800/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.8))};i.onerror=()=>r('');i.src=fr.result};fr.onerror=()=>r('');fr.readAsDataURL(f)});
function art(a,b,c,v,k){v=v%3;k=k||'kjas'[v%4];
const fx="<filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' seed='"+(v+4)+"'/><feColorMatrix type='saturate' values='0'/></filter><filter id='w'><feTurbulence baseFrequency='.025' numOctaves='3' seed='"+(v+2)+"'/><feDisplacementMap in='SourceGraphic' scale='10'/></filter><filter id='b'><feGaussianBlur stdDeviation='7'/></filter>";
const sun=(x,y,r)=>`<radialGradient id='g'><stop offset='0' stop-color='${c}' stop-opacity='.95'/><stop offset='1' stop-color='${c}' stop-opacity='0'/></radialGradient><circle cx='${x}' cy='${y}' r='${r*2.4}' fill='url(#g)'/><circle cx='${x}' cy='${y}' r='${r}' fill='${c}'/>`;
const K='#2b332d',st=`stroke='${K}' stroke-width='2.5' stroke-linejoin='round'`;
if(k==='k'){const x=v==1?290:110;
const L=[`<path d='M0 205Q90 150 180 190T400 160V300H0Z' fill='${mx(b,.4,1)}'/><path d='M0 235Q120 180 230 225T400 205V300H0Z' fill='${b}'/><path d='M0 275Q150 240 400 268V300H0Z' fill='${mx(b,.5)}'/>`,
`<path d='M0 195L110 105L200 180L295 85L400 175V300H0Z' fill='${mx(b,.35,1)}'/><path d='M0 240Q100 190 200 232T400 215V300H0Z' fill='${b}'/>`,
`<rect y='218' width='400' height='82' fill='${mx(b,.25)}'/><path d='M0 218Q100 196 200 218T400 210V226H0Z' fill='${mx(b,.4,1)}'/><path d='M300 218V150M302 165l-22-18M302 180l20-16' stroke='${mx(b,.6)}' stroke-width='5' fill='none'/><circle cx='304' cy='140' r='32' fill='${mx(b,.1)}'/>`][v];
return SV(`<defs><linearGradient id='s' x2='0' y2='1'><stop offset='0' stop-color='${mx(a,.3,1)}'/><stop offset='1' stop-color='${a}'/></linearGradient>${fx}</defs><rect width='400' height='300' fill='url(#s)'/><g filter='url(#w)'>${sun(x,95,30)}${L}</g><rect width='400' height='300' filter='url(#n)' opacity='.12'/>`)}
if(k==='j'){const R=[`<path d='M0 190L90 140L170 175L260 120L340 165L400 140V300H0Z' fill='${mx(b,.45,1)}'/><path d='M0 220L120 175L220 215L320 170L400 200V300H0Z' fill='${mx(b,.2,1)}'/><path d='M0 255L150 225L300 250L400 235V300H0Z' fill='${b}'/>`,
`<path d='M0 170Q100 120 200 165T400 130V300H0Z' fill='${mx(b,.3,1)}'/><rect x='-20' y='170' width='440' height='34' fill='#fff' opacity='.5' filter='url(#b)'/><path d='M0 215Q120 175 230 210T400 190V300H0Z' fill='${mx(b,.1,1)}'/><rect x='-20' y='222' width='440' height='30' fill='#fff' opacity='.4' filter='url(#b)'/><path d='M0 262Q150 232 400 258V300H0Z' fill='${b}'/>`,
`<g fill='${b}'><rect x='20' y='150' width='60' height='150'/><rect x='95' y='110' width='50' height='190'/><rect x='160' y='165' width='70' height='135'/><rect x='245' y='95' width='55' height='205'/><rect x='315' y='140' width='70' height='160'/></g><g fill='${c}' opacity='.8'><rect x='108' y='130' width='8' height='10'/><rect x='258' y='120' width='8' height='10'/><rect x='258' y='150' width='8' height='10'/><rect x='330' y='165' width='8' height='10'/></g><rect y='268' width='400' height='32' fill='${mx(b,.4)}'/>`][v];
